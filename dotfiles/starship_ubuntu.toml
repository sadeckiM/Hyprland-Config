add_newline = false

format = """
[  ](bg:#FFFFFF fg:#E95420 bold)\
[](bg:#E95420 fg:#FFFFFF)\
$username\
[](bg:#FFFFFF fg:#E95420)\
$directory\
[](fg:#FFFFFF bg:#FFB380)\
$git_branch\
$git_status\
[](fg:#FFB380 bg:#FF7315)\
$c$golang$python$rust$nodejs$docker_context\
[](fg:#FF7315 bg:#B83B0F)\
[ ](fg:#B83B0F)\
"""

#[  ](bg:#B83B0F fg:#FFFFFF)\
[username]
show_always = true
style_user = "bg:#E95420 fg:#FFFFFF bold"
format = '[ $user ]($style)'

[directory]
style = "bg:#FFFFFF fg:#E95420 bold"
format = "[ $path ]($style)"
truncation_length = 3

[git_branch]
symbol = ""
style = "bg:#FFB380 fg:#333333 bold"
format = '[[ $symbol $branch ]($style)]($style)'

[git_status]
style = "bg:#FFB380 fg:#333333 bold"
conflicted = "[=](bg:#FFB380 fg:#CC0000 bold)"
ahead = "[⇡](bg:#FFB380 fg:#0044CC bold)"
behind = "[⇣](bg:#FFB380 fg:#0044CC bold)"
untracked = "[?](bg:#FFB380 fg:#8A6D00 bold)"
modified = "[!](bg:#FFB380 fg:#D35400 bold)"
staged = "[+](bg:#FFB380 fg:#006622 bold)"
deleted = "[✘](bg:#FFB380 fg:#CC0000 bold)"
format = '[([$all_status$ahead_behind]($style))]($style)'

[c]
symbol = " "
style = "bg:#FF7315 fg:#FFFFFF bold"
format = '[ $symbol ]($style)'

[golang]
symbol = "Hamster "
style = "bg:#FF7315 fg:#FFFFFF bold"
format = '[ $symbol]($style)'

[rust]
symbol = "Crab "
style = "bg:#FF7315 fg:#FFFFFF bold"
format = '[ $symbol]($style)'

[nodejs]
symbol = "Node "
style = "bg:#FF7315 fg:#FFFFFF bold"
format = '[ $symbol ]($style)'

[docker_context]
symbol = "🐳 "
style = "bg:#FF7315 fg:#FFFFFF bold"
format = '[ $symbol$context ]($style)'

[python]
symbol = "󰌠 "
style = "bg:#FF7315 fg:#FFFFFF bold"
format = '[ $symbol($virtualenv) ]($style)'
detect_extensions = []
detect_files = []
detect_folders = []
